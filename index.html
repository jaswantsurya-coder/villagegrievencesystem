<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village Grievance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #0284c7;
        --color-primary-hover: #0369a1;
        --color-primary-light: #e0f2fe;
        --color-background: #f8fafc;
        --color-surface: #ffffff;
        --color-text: #0f172a;
        --color-text-muted: #475569;
        --color-border: #e2e8f0;
        --color-danger: #dc2626;
        --color-danger-bg: #fef2f2;
        --color-success: #16a34a;
        --color-success-bg: #f0fdf4;
        --hero-overlay: linear-gradient(to top, rgba(248, 250, 252, 1) 0%, rgba(248, 250, 252, 0.6) 50%, rgba(248, 250, 252, 0.2) 100%);
      }

      [data-theme="dark"] {
        --color-primary: #38bdf8;
        --color-primary-hover: #7dd3fc;
        --color-primary-light: #0c4a6e;
        --color-background: #0f172a;
        --color-surface: #1e293b;
        --color-text: #f8fafc;
        --color-text-muted: #94a3b8;
        --color-border: #334155;
        --color-danger: #ef4444;
        --color-danger-bg: #450a0a;
        --color-success: #22c55e;
        --color-success-bg: #052e16;
        --hero-overlay: linear-gradient(to top, rgba(15, 23, 42, 1) 0%, rgba(15, 23, 42, 0.8) 50%, rgba(15, 23, 42, 0.4) 100%);
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--color-background);
        color: var(--color-text);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
