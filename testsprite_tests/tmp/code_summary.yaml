version: "2"
type: backend
tech_stack:
  - PL/pgSQL
  - SQL
  - PostgreSQL
  - Supabase
features:
  - name: Complaint Submission API
    description: Submit a new community complaint with auto-geographic boundaries resolution
    files:
      - 001_unified_database_setup.sql
    endpoints:
      - method: POST
        path: rpc/svc_create_complaint
        description: Create a complaint (supports anonymous or authenticated submissions)
        auth_required: false
        request_schema:
          body:
            p_title: string
            p_description: string
            p_category: string
            p_location: string
            p_latitude: number
            p_longitude: number
            p_photos: array
            p_photo_urls: array
            p_related_scheme: string
            p_is_anonymous: boolean
            p_anonymous_phone: string
            p_village_id: number
        response_schema:
          "200":
            success: boolean
            complaint_id: string
            ticket_id: string
            error: string
  - name: Village Membership Management
    description: Join a village using a village unique join code
    files:
      - 001_unified_database_setup.sql
    endpoints:
      - method: POST
        path: rpc/svc_join_village
        description: Joins the current user to a village
        auth_required: true
        request_schema:
          body:
            p_code: string
        response_schema:
          "200":
            success: boolean
            village_id: number
            village_name: string
            error: string
  - name: Admin Verification & Approval
    description: Super Admin workflows to approve or reject village admin promotion requests
    files:
      - 001_unified_database_setup.sql
    endpoints:
      - method: POST
        path: rpc/svc_approve_admin_request
        description: Approve admin request and promote profile to admin
        auth_required: true
        request_schema:
          body:
            p_request_id: number
        response_schema:
          "200":
            success: boolean
            village_id: number
            village_name: string
            join_code: string
            user_id: string
            error: string
      - method: POST
        path: rpc/svc_reject_admin_request
        description: Reject admin request
        auth_required: true
        request_schema:
          body:
            p_request_id: number
        response_schema:
          "200":
            success: boolean
            error: string
  - name: Village Setup & Join Codes
    description: Administrative tools to fetch village join codes
    files:
      - 001_unified_database_setup.sql
    endpoints:
      - method: POST
        path: rpc/get_current_village_join_code
        description: Get the join code for a village
        auth_required: true
        request_schema:
          body:
            p_id: number
        response_schema:
          "200": string
known_limitations: []
