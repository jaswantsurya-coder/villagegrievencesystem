name: CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: 1. Code Quality & Lint Gate
      run: npm run lint

    - name: 2. Automated Unit & Contract Test Gate
      run: npm test

    - name: 3. Production Bundle Build Gate
      run: npm run build
